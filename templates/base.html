<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MSTIP RoomSync{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">MSTIP RoomSync</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'room_list' %}">Rooms</a>
                    </li>
                    
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'book_room' %}">Book a Room</a>
                        </li>
                        
                        <!-- Only show Admin Approvals to staff -->
                        {% if user.is_staff %}
                            <li class="nav-item">
                                <a class="nav-link text-warning fw-bold" href="{% url 'approve_bookings' %}">Admin Approvals</a>
                            </li>
                        {% endif %}
                        
                        <li class="nav-item d-flex align-items-center">
                            <span class="nav-link disabled" style="color: #e0e0e0;">Hello, {{ user.username }}</span>
                        </li>

                        <li class="nav-item">
                            <!-- Logout must be a POST request in modern Django -->
                            <form method="POST" action="{% url 'logout' %}" class="d-flex align-items-center ms-3 mb-0">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger btn-sm px-2 py-2" style="border-radius: 8px; font-weight: 500;">
                                    Logout
                                </button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Login</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container mt-4">

        <!-- This block is where individual page content will go -->
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
